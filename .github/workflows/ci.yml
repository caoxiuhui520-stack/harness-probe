name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test (py${{ matrix.python }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.9", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Unit tests
        run: python -m pytest tests -q

      - name: Validate bundled tasks and matrix
        run: python -m harnessprobe validate tasks --matrix configs/matrix-core.json

      - name: Task purity — starting state must fail, no leaked solution
        run: python -m harnessprobe verify-tasks tasks

      - name: Reference solutions still pass
        run: python -m harnessprobe check-solutions tasks

      # The Windows runner defaults to PowerShell, where a trailing backslash
      # is not a line continuation. Keep this command on one line so the same
      # step works under both bash and pwsh.
      - name: Offline end-to-end run
        run: python -m harnessprobe run tasks --matrix configs/matrix-core.json --provider mock --model mock-1 --mock-script tests/mock_script.json --trials 1 --out .harnessprobe/ci

      - name: Check the report was produced
        run: python -c "import pathlib,sys; p=sorted(pathlib.Path('.harnessprobe/ci').glob('*/report.md')); sys.exit(0 if p else 1)"

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install ruff
      - run: ruff check harnessprobe tests
      - run: ruff format --check harnessprobe tests
