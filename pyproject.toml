[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "harnessprobe"
version = "0.1.0"
description = "Measure how much a model's measured coding ability depends on its harness."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "HarnessProbe contributors" }]
keywords = ["llm", "evaluation", "agent", "harness", "benchmark", "reproducibility"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Testing",
]
dependencies = []

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
dev = ["pytest>=7", "pytest-cov>=4"]

[project.scripts]
harnessprobe = "harnessprobe.cli:main"

[project.urls]
Homepage = "https://github.com/caoxiuhui520-stack/harness-probe"
Issues = "https://github.com/caoxiuhui520-stack/harness-probe/issues"

[tool.setuptools.packages.find]
include = ["harnessprobe*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff.lint]
# BLE001 is disabled for two deliberate broad catches: a grader that raises is
# a task bug that must fail the trial rather than kill the run, and a tool that
# raises must surface as a tool error the model can read. Both are annotated at
# the call site.
extend-ignore = ["BLE001"]
